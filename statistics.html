<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Statistics</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.dark-mode{
    background:#121212;
    color:white;
}

.dark-mode .card{
    background:#1f1f1f;
    border:1px solid #444;
}

</style>

</head>

<body>

<h1>📊 Eden Chess Statistics</h1>

<div id="stats" class="card">
Loading statistics...
</div>

<br>

<a href="index.html">
← Return to Home Page
</a>

<script>

fetch('players.csv')
.then(response => response.text())
.then(text => {

    const rows = text.trim().split('\n');

    const totalPlayers = rows.length - 1;

    document.getElementById('stats').innerHTML = `
        <h2>♟️ Total Players</h2>
        <h1>${totalPlayers}</h1>
    `;

});

</script>

</body>
</html>
