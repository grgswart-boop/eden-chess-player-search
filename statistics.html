<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eden Chess Statistics</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#f2f2f2;
}

.dark-mode{
    background:#121212;
    color:white;
}

.dark-mode .card{
    background:#1f1f1f;
    border:1px solid #444;
    color:white;
}

.dark-mode th{
    background:#2d2d2d;
}

.dark-mode td,
.dark-mode th{
    border:1px solid #444;
}

.dark-mode a{
    color:#4da3ff;
}

</style>

</head>

<body>

<h1>📊 Eden Chess Statistics</h1>

<button onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

<div id="stats" class="card">
Loading statistics...
</div>

<br>

<a href="index.html">
← Return to Home Page
</a>

<script>

function toggleDarkMode(){

    document.body.classList.toggle('dark-mode');

    localStorage.setItem(
        'darkMode',
        document.body.classList.contains('dark-mode')
    );

}

window.onload = function(){

    if(localStorage.getItem('darkMode') === 'true'){
        document.body.classList.add('dark-mode');
    }

};

fetch('players.csv')
.then(response => response.text())
.then(text => {

    const rows = text.trim().split('\n');

    const headers = rows[0].split(',');

    const players = rows.slice(1).map(row => {

        const values = row.split(',');

        let player = {};

        headers.forEach((header,index) => {
            player[header.trim()] = values[index];
        });

        return player;

    });

    const totalPlayers = players.length;

    const fidePlayers = players.filter(player =>
        player.FIDE_ID &&
        player.FIDE_ID.trim() !== ''
    ).length;

    const schools = new Set();

    const schoolCounts = {};

    players.forEach(player => {

        const school = player["School/Club"];

        if(school && school.trim() !== ''){

            schools.add(school.trim());

            schoolCounts[school] =
                (schoolCounts[school] || 0) + 1;

        }

    });

    const topSchools = Object.entries(schoolCounts)
    .sort((a,b) => b[1] - a[1])
    .slice(0,10);

    let topSchoolsHTML = '';

    topSchools.forEach((school,index) => {

        topSchoolsHTML += `
        <tr>
            <td>${index + 1}</td>
            <td>${school[0]}</td>
            <td>${school[1]}</td>
        </tr>
        `;

    });

    const birthYearCounts = {};

    players.forEach(player => {

        const year = player.BirthYear;

        if(year && year.trim() !== ''){

            birthYearCounts[year] =
                (birthYearCounts[year] || 0) + 1;

        }

    });

    const sortedBirthYears = Object.entries(birthYearCounts)
    .sort((a,b) => b[0] - a[0]);

    let birthYearHTML = '';

    sortedBirthYears.forEach(year => {

        birthYearHTML += `
        <tr>
            <td>${year[0]}</td>
            <td>${year[1]}</td>
        </tr>
        `;

    });

    let largestGroupYear = 'N/A';
    let largestGroupCount = 0;

    Object.entries(birthYearCounts).forEach(([year,count]) => {

        if(count > largestGroupCount){

            largestGroupYear = year;
            largestGroupCount = count;

        }

    });

    document.getElementById('stats').innerHTML = `

    <div class="card">
        <h2>♟️ Total Players</h2>
        <h1>${totalPlayers}</h1>
    </div>

    <div class="card">
        <h2>🌍 Players with FIDE IDs</h2>
        <h1>${fidePlayers}</h1>
    </div>

    <div class="card">
        <h2>🏫 Schools / Clubs</h2>
        <h1>${schools.size}</h1>
    </div>

    <div class="card">
        <h2>🎂 Largest Birth Year Group</h2>
        <h1>${largestGroupYear}</h1>
        <p>${largestGroupCount} players</p>
    </div>

    <div class="card">

        <h2>🏆 Top 10 Schools / Clubs</h2>

        <table>

            <tr>
                <th>Rank</th>
                <th>School / Club</th>
                <th>Players</th>
            </tr>

            ${topSchoolsHTML}

        </table>

    </div>

    <div class="card">

        <h2>📅 Players by Birth Year</h2>

        <table>

            <tr>
                <th>Birth Year</th>
                <th>Players</th>
            </tr>

            ${birthYearHTML}

        </table>

    </div>

    `;

})
.catch(error => {

    document.getElementById('stats').innerHTML =
    '<div class="card">❌ Error loading players.csv</div>';

    console.error(error);

});

</script>

</body>

</html>
